apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: aztec
  name: aztec
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aztec
  strategy: {}
  template:
    metadata:
      labels:
        app: aztec
    spec:
      containers:
      - image: httpd:alpine3.18
        name: httpd
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

